:root{color-scheme:light;--ink:#172220;--muted:#495550;--teal:#12544f;--teal-dark:#103d3a;--paper:#fafaf8;--white:#fff;--mist:#ebf0ed;--line:#d7dcd8;--header:72px;--page:1352px;--gutter:clamp(18px,4vw,64px);--radius:12px}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header) + 20px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
img{display:block;max-width:100%}
button,a,input,select,textarea,summary{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #006f62;outline-offset:4px}main:focus,h2[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
h1,h2,h3,p,figure{margin:0}
h1,h2,h3{letter-spacing:-.035em;line-height:1.12}
h1{font-size:clamp(36px,4.3vw,66px);font-weight:750}
h2{font-size:clamp(31px,3.3vw,53px);font-weight:750}
h3{font-size:22px;font-weight:750}
.skip{position:fixed;z-index:20;top:-80px;left:10px;padding:12px;background:white}
.skip:focus{top:8px}
.shell{width:min(var(--page),calc(100% - 2 * var(--gutter)));margin-inline:auto}
.ico{width:19px;height:19px;flex:0 0 auto;vertical-align:middle}
.b{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:11px;padding:0 17px;border:1px solid transparent;border-radius:4px;font-weight:750;background:none;line-height:1.2;white-space:normal;text-align:center}
.b.primary{background:var(--teal);color:white}
.b.primary:hover{background:var(--teal-dark)}
.b.outline{border-color:#8facaa;background:#ffffffa8;color:var(--teal)}
.b.outline:hover,.b.quiet:hover{background:#e4f0ec}
.b.quiet{background:var(--mist);color:var(--teal)}
.b.small{min-height:42px;font-size:13px;padding:0 12px}
.text-link{display:inline-flex;align-items:center;gap:9px;font-weight:750;color:var(--teal);min-height:44px}
.text-link:hover{text-decoration:underline;text-underline-offset:4px}
.header{height:var(--header);position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:1px solid var(--line);}
.header-inner{height:100%;display:flex;align-items:center;gap:27px;justify-content:space-between}
.brand{display:inline-flex;align-items:center;flex:none;min-height:44px}.brand img{width:clamp(145px,14vw,205px);height:auto}
.topnav{display:flex;align-items:center;gap:clamp(15px,2.15vw,34px);font-weight:750;color:#29433f}
.topnav a{min-height:44px;display:inline-flex;gap:6px;align-items:center}
.topnav a:hover,.topnav a[aria-current="page"]{color:var(--teal);text-decoration:underline;text-underline-offset:5px}
.header-actions{display:flex;gap:9px;align-items:center}
.icon-button{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);background:var(--white);border-radius:4px}
.icon-button:hover{background:var(--mist)}
.menu-toggle,.nav-panel{display:none}
.hero{background:#f7f7f3;border-bottom:1px solid var(--line)}
.hero-grid{min-height:520px;display:grid;grid-template-columns:1.08fr .92fr;align-items:stretch}
.hero-copy{padding:48px 25px 52px 0;align-self:center}
.kicker{display:flex;align-items:center;gap:9px;color:var(--teal);font-weight:750;font-size:11px;line-height:1.4;letter-spacing:.115em;text-transform:uppercase}

.hero-copy h1{margin:0 0 23px;font-size:clamp(37px,4.35vw,67px);line-height:1.04;letter-spacing:-.036em}
.hero-copy p{max-width:440px;color:var(--muted);font-size:clamp(15px,1.21vw,18px);line-height:1.6}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}
.hero-visual{position:relative;min-width:0;min-height:100%;overflow:hidden;isolation:isolate;background:#edede9}

function updateCatalog() {
  const results = document.getElementById('catalog-results');
  if (!results) return;
  const normalize = s => s.toLocaleLowerCase('ru').replaceAll('ё','е').trim();
  const words = normalize(catalogState.query).split(/\s+/).filter(Boolean);
  let matches = products.filter(p => {
    const text = normalize([p.name,p.title,p.id,categoryName(p.category)].join(' '));
    return (catalogState.category === 'all' || p.category === catalogState.category) && words.every(word => text.includes(word));
  });
  if (catalogState.sort !== 'featured') {
    const sign = catalogState.sort === 'az' ? 1 : -1;
    matches = matches.sort((a,b) => sign * a.title.localeCompare(b.title,'ru',{numeric:true}));
  }
  main.querySelectorAll('[data-category]').forEach(b => b.setAttribute('aria-pressed', b.dataset.category === catalogState.category));
  const count = document.getElementById('catalog-count');
  const shown = Math.min(matches.length,catalogState.limit);
  count.textContent = 'Показано ' + shown + ' из ' + matches.length;
  const chip = main.querySelector('[data-clear-category]');
  chip.hidden = catalogState.category === 'all';
  chip.textContent = categoryName(catalogState.category) + ' ×';
  chip.setAttribute('aria-label','Убрать фильтр ' + categoryName(catalogState.category));
  main.querySelector('.catalog-meta [data-reset]').hidden = catalogState.category === 'all' && !catalogState.query && catalogState.sort === 'featured';
  results.innerHTML = matches.length
    ? '<div class="grid">' + matches.slice(0,catalogState.limit).map(card).join('') + '</div>' +
      (matches.length > catalogState.limit ? '<div class="more-row"><button class="b outline" type="button" data-more>Показать ещё ' + icon('down') + '</button></div>' : '')
    : '<div class="empty"><h3>По этому запросу ничего не найдено</h3><p>Измените поисковый запрос или категорию.</p><button class="b outline" type="button" data-reset>Сбросить фильтры</button></div>';
}

  routeType = model ? 'product' : path === '/catalog' ? 'catalog' : path === '/services' ? 'services' : 'home';
  navigation();
  footer();
  main.className = routeType === 'catalog' ? 'catalog-page' : '';
  if (routeType === 'catalog') {
    main.innerHTML = '<div class="page-intro"><div class="shell">' + bread('Каталог') + '<h1>Косметологическое оборудование</h1><p>Оборудование для клиник, салонов и косметологических кабинетов.</p></div></div>' + catalogMarkup(false);
  } else if (model) {
    main.innerHTML = renderProduct(model);
  } else if (routeType === 'services') {
    main.innerHTML = servicesMarkup();
  } else {
    main.innerHTML = hero() + catalogMarkup(true) + homeContent();
  }
  document.title = (model ? model.title + ' — ' : routeType === 'catalog' ? 'Каталог — ' : '') + 'SKIN DEVICE — оборудование для косметологии';
  const input = document.getElementById('catalog-search');
  if (input) {
    input.value = catalogState.query;
    document.getElementById('catalog-sort').value = catalogState.sort;
    updateCatalog();
  }
  requestAnimationFrame(() => {
    const target = section && document.getElementById(section);
    if (target) {
      target.scrollIntoView({block:'start'});
      const heading = target.querySelector('h2');
      if (heading) {
        heading.tabIndex = -1;
        heading.focus({preventScroll:true});
      }
    } else {
      window.scrollTo(0,0);
      main.focus({preventScroll:true});
    }
  });
}
const intents = {
  consultation:'Запросить консультацию', selection:'Подобрать оборудование', price:'Запросить стоимость',
  offers:'Уточнить акции и новинки', training:'Запросить программу обучения', documents:'Запросить документы',
  finance:'Уточнить условия покупки', services:'Запись к косметологу'
};
const info = {
  documents:['Сертификация оборудования','Документы уточняются по конкретной модели. Подтверждённые документы будут добавлены после согласования.','documents'],
  service:['Гарантия и ремонт','Условия гарантии, обслуживания и ремонта уточняются для выбранного аппарата.','consultation'],
  finance:['Кредит и рассрочка','Предлагаемые финансовые условия зависят от выбранного оборудования. Запросите актуальные варианты у менеджера.','finance'],
  delivery:['Оплата и доставка','Способы оплаты и условия поставки уточняются в коммерческом предложении.','finance'],
  social:['Социальный контракт и материнский капитал','Применимость и условия будут добавлены после подтверждения заказчиком.','consultation'],
  privacy:['Политика обработки данных','Здесь будет размещён согласованный текст политики и согласия. Данные из демонстрационной формы никуда не передаются.'],
  legal:['Реквизиты','В финальной версии здесь будут размещены утверждённые реквизиты продавца.']
};
const closeButton = '<button class="icon-button" type="button" data-close aria-label="Закрыть">' + icon('close') + '</button>';
function showRequest(intent,id) {
  if (infoDialog.open) infoDialog.close();
  const product = productById(id);
  requestDialog.innerHTML = '<div class="dialog-header"><h2 id="request-title">' + intents[intent] + '</h2>' + closeButton + '</div>' +
    '<p class="dialog-sub">' + (product ? esc(product.title) : 'Оставьте контакт для обратной связи.') + '</p>' +
    '<form id="request-form" novalidate><input type="hidden" name="intent" value="' + intent + '"><input type="hidden" name="product" value="' + (product?.id ?? '') +
    '"><label class="form-label">Имя<input name="name" autocomplete="name" required></label><label class="form-label">Телефон или email<input name="contact" autocomplete="on" required aria-describedby="request-error"></label>' +
    '<label class="form-label">Комментарий <span style="font-weight:500">(необязательно)</span><textarea name="comment" rows="2"></textarea></label>' +
    '<label class="consent"><input type="checkbox" name="consent" required><span>Даю согласие на обработку данных. Демонстрационный текст.</span></label><p class="form-error" id="request-error" role="alert" hidden></p>' +
    '<button class="b primary" type="submit">Проверить отправку</button><p class="dialog-note">Демонстрационная форма. Введённые данные не передаются.</p></form>';
  requestDialog.showModal();
  requestDialog.querySelector('[name="name"]').focus();
}
function showInfo(id) {
  const [title,body,intent] = info[id];
  infoDialog.innerHTML = '<div class="dialog-header"><h2 id="info-title">' + title + '</h2>' + closeButton + '</div><p class="dialog-sub">' + body + '</p>' +
    (intent ? ask('Уточнить у менеджера',intent,'','outline') : '');
  infoDialog.showModal();
}
function tabSelect(id, focus = false) {
  main.querySelectorAll('[data-tab]').forEach(b => {
    const active = b.dataset.tab === id;
    b.setAttribute('aria-selected',active);
    b.tabIndex = active ? 0 : -1;
    document.getElementById(b.getAttribute('aria-controls')).hidden = !active;
    if (focus && active) b.focus();
  });
}
function toggleMenu(force) {
  const button = header.querySelector('.menu-toggle');
  const nav = document.getElementById('mobile-nav');
  const open = force ?? nav.hidden;
  nav.hidden = !open;
  button.setAttribute('aria-expanded', open);
  button.setAttribute('aria-label',open ? 'Закрыть меню' : 'Открыть меню');
  button.innerHTML = icon(open ? 'close' : 'menu');
}
function resetCatalog() {
  Object.assign(catalogState,{category:'all',query:'',sort:'featured',limit:catalogLimit});
  const search = document.getElementById('catalog-search');
  search.value = '';
  document.getElementById('catalog-sort').value = 'featured';
  updateCatalog();
  search.focus();
}
document.addEventListener('click', e => {
  if (e.target.closest('.skip')) {
    e.preventDefault();
    main.focus();
    return;
  }
  const a = e.target.closest('.nav-panel a');
  if (a) toggleMenu(false);
  const sameRoute = e.target.closest('a[href^="#/"]');
  if (sameRoute && sameRoute.getAttribute('href') === location.hash) {
    e.preventDefault();
    render();
  }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-close')) {
    b.closest('dialog').close();
  } else if (b.dataset.ask) {
    if (!b.closest('dialog')) trigger = b;
    showRequest(b.dataset.ask,b.dataset.id);
  } else if (b.dataset.info) {
    trigger = b;
    showInfo(b.dataset.info);
  } else if (b.classList.contains('menu-toggle')) {
    toggleMenu();
  } else if (b.classList.contains('filter-toggle')) {
    const isOpen = document.getElementById('category-filters').classList.toggle('open');
    b.setAttribute('aria-expanded',isOpen);
  } else if (b.dataset.category || b.hasAttribute('data-clear-category')) {
    catalogState.category = b.dataset.category ?? 'all';
    catalogState.limit = catalogLimit;
    updateCatalog();
    if (b.hasAttribute('data-clear-category')) document.getElementById('catalog-search').focus();
    if (b.dataset.category && matchMedia('(max-width:800px)').matches) {
      document.getElementById('category-filters').classList.remove('open');
      const toggle = main.querySelector('.filter-toggle');
      toggle.setAttribute('aria-expanded','false');
      toggle.focus({preventScroll:true});
    }
  } else if (b.hasAttribute('data-reset')) {
    resetCatalog();
  } else if (b.hasAttribute('data-more')) {
    const previous = document.querySelectorAll('#catalog-results article').length;
    const count = document.getElementById('catalog-count');
    b.disabled = true;
    b.textContent = 'Загрузка…';
    setTimeout(() => {
      if (!count.isConnected || !b.isConnected) return;
      catalogState.limit += 6;
      updateCatalog();
      document.querySelectorAll('#catalog-results article')[previous]?.querySelector('a')?.focus();
    }, 180);
  } else if (b.dataset.tab) {
    tabSelect(b.dataset.tab);
  } else if (b.hasAttribute('data-photo')) {
    activePhoto = Number(b.dataset.photo);
    const photo = document.getElementById('product-photo');
    photo.src = activePhoto ? currentProduct.detail : currentProduct.photo;
    photo.alt = currentProduct.name + (activePhoto ? ', детали' : '');
    main.querySelectorAll('[data-photo]').forEach(v => v.setAttribute('aria-pressed',v === b));
  } else if (b.hasAttribute('data-zoom')) {
    trigger = b;
    zoomDialog.innerHTML = '<div class="dialog-header"><h2 id="zoom-title">' + esc(currentProduct.title) + '</h2>' + closeButton + '</div><img src="' +
      (activePhoto ? currentProduct.detail : currentProduct.photo) + '" alt="' + esc(currentProduct.name) + '">';
    zoomDialog.showModal();
  }
});
document.addEventListener('input',e => {
  if (e.target.id !== 'catalog-search') return;
  catalogState.query = e.target.value;
  catalogState.limit = catalogLimit;
  updateCatalog();
});
document.addEventListener('change',e => {
  if (e.target.id !== 'catalog-sort') return;
  catalogState.sort = e.target.value;
  catalogState.limit = catalogLimit;
  updateCatalog();
});
document.addEventListener('keydown',e => {
  if (e.key === 'Escape' && !document.getElementById('mobile-nav')?.hidden) {
    toggleMenu(false);
    header.querySelector('.menu-toggle').focus();
  }
  if (!e.target.matches('[role="tab"]')) return;
  const buttons = [...main.querySelectorAll('[role="tab"]')];
  const from = buttons.indexOf(e.target);
  const to = {ArrowLeft:(from-1+buttons.length)%buttons.length,ArrowRight:(from+1)%buttons.length,Home:0,End:buttons.length-1}[e.key];
  if (to === undefined) return;
  e.preventDefault();
  tabSelect(buttons[to].dataset.tab,true);
});
document.addEventListener('submit',e => {
  if (e.target.id !== 'request-form') return;
  e.preventDefault();
  const fields = e.target.elements;
  const err = document.getElementById('request-error');
  const contact = fields.contact.value.trim();
  const validContact = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact) || (/^[+\d()\-\s]+$/.test(contact) && contact.replace(/\D/g,'').length >= 10 && contact.replace(/\D/g,'').length <= 15);
  const invalid = !fields.name.value.trim() ? [fields.name,'Укажите имя.'] : !validContact ? [fields.contact,'Укажите телефон или корректный email.'] : !fields.consent.checked ? [fields.consent,'Подтвердите согласие.'] : null;
  [fields.name,fields.contact,fields.consent].forEach(f => f.removeAttribute('aria-invalid'));
  if (invalid) {
    invalid[0].setAttribute('aria-invalid','true');
    err.textContent = invalid[1];
    err.hidden = false;
    invalid[0].focus();
    return;
  }
  requestDialog.innerHTML = '<div class="dialog-header"><h2 id="request-title">Форма заполнена</h2>' + closeButton + '</div><p class="dialog-sub" role="status">Проверка прошла. В прототипе данные не отправляются.</p><button class="b primary" type="button" data-close>Готово</button>';
  requestDialog.querySelector('.b').focus();
});
[requestDialog,infoDialog,zoomDialog].forEach(dialog => {
  dialog.addEventListener('close',() => {
    if (document.querySelector('dialog[open]')) return;
    if (trigger?.isConnected) trigger.focus();
    trigger = null;
  });
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
